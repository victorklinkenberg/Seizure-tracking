<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Seizure Log</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0f1115">
<style>
  :root {
    --bg: #0f1115;
    --card: #1a1d24;
    --accent: #4f7cff;
    --accent-dark: #3a5fd9;
    --danger: #e5484d;
    --text: #f2f3f5;
    --text-dim: #9aa0ab;
    --border: #2a2e37;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    height: 100%;
    -webkit-tap-highlight-color: transparent;
  }
  #app {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 20px 16px 40px;
  }
  h1 {
    font-size: 20px;
    font-weight: 600;
    text-align: center;
    margin: 8px 0 24px;
    color: var(--text);
  }
  .home-buttons {
    display: flex;
    flex-direction: column;
    gap: 16px;
    margin-top: 20px;
  }
  button {
    font-family: inherit;
    cursor: pointer;
    border: none;
  }
  .big-btn {
    padding: 28px 20px;
    border-radius: 18px;
    font-size: 19px;
    font-weight: 600;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    transition: transform 0.1s ease, opacity 0.15s ease;
  }
  .big-btn:active { transform: scale(0.97); opacity: 0.9; }
  .log-btn { background: linear-gradient(135deg, var(--accent), var(--accent-dark)); }
  .history-btn { background: var(--card); border: 1px solid var(--border); color: var(--text); }
  .icon { font-size: 24px; }

  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: #2ecc71;
    color: #08210f;
    padding: 12px 22px;
    border-radius: 12px;
    font-weight: 600;
    font-size: 15px;
    opacity: 0;
    transition: opacity 0.25s ease, transform 0.25s ease;
    pointer-events: none;
    z-index: 100;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
  }
  .back-btn {
    background: none;
    color: var(--accent);
    font-size: 16px;
    font-weight: 600;
    padding: 8px 0;
  }
  .export-btn {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 14px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
  }

  .empty-state {
    text-align: center;
    color: var(--text-dim);
    margin-top: 60px;
    font-size: 15px;
    line-height: 1.5;
  }

  .entry-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .entry {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 16px;
  }
  .entry-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  .entry-date {
    font-weight: 600;
    font-size: 15px;
  }
  .entry-time {
    color: var(--text-dim);
    font-size: 13px;
    margin-top: 2px;
  }
  .entry-actions {
    display: flex;
    gap: 8px;
  }
  .icon-btn {
    background: none;
    color: var(--text-dim);
    font-size: 18px;
    padding: 4px 6px;
  }
  .icon-btn.delete { color: var(--danger); }
  .comment-box {
    width: 100%;
    background: #12151b;
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    padding: 10px 12px;
    font-size: 14px;
    font-family: inherit;
    resize: vertical;
    min-height: 40px;
    margin-top: 4px;
  }
  .comment-box:focus { outline: 1px solid var(--accent); }
  .comment-label {
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 4px;
    display: block;
  }
  .save-hint {
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 4px;
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  .save-hint.show { opacity: 1; }

  .footer-note {
    text-align: center;
    color: var(--text-dim);
    font-size: 12px;
    margin-top: auto;
    padding-top: 30px;
  }

  .loading {
    text-align: center;
    color: var(--text-dim);
    margin-top: 60px;
  }

  .stats-row {
    display: flex;
    gap: 10px;
    margin-bottom: 18px;
  }
  .stat-tile {
    flex: 1;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 12px 10px;
    text-align: center;
  }
  .stat-tile .v {
    font-size: 22px;
    font-weight: 700;
    line-height: 1.15;
  }
  .stat-tile .l {
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 3px;
    line-height: 1.3;
  }
  .chart-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px 14px;
    margin-bottom: 14px;
  }
  .chart-card h2 {
    font-size: 14px;
    font-weight: 600;
    margin: 0 0 2px;
  }
  .chart-card .cap {
    font-size: 12px;
    color: var(--text-dim);
    margin: 0 0 12px;
  }
  .chart-card svg { display: block; width: 100%; overflow: visible; }
  .bar-fill { fill: var(--accent); }
  .bar-label { font-size: 10.5px; fill: var(--text-dim); text-anchor: middle; }
  .axis-label { font-size: 10.5px; fill: var(--text-dim); }
  .grid-line { stroke: var(--border); stroke-width: 1; }
  .baseline { stroke: var(--text-dim); stroke-width: 1; opacity: 0.5; }

  #todScroll {
    scrollbar-width: thin;
    -webkit-overflow-scrolling: touch;
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
const STORAGE_KEY = 'seizure-events';
let events = [];
let view = 'home'; // 'home' | 'history' | 'stats'
let loaded = false;

const app = document.getElementById('app');

function fmtDate(d) {
  return d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
}
function fmtTime(d) {
  return d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
}

async function loadEvents() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    events = raw ? JSON.parse(raw) : [];
  } catch (e) {
    events = [];
  }
  loaded = true;
}

async function saveEvents() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(events));
    return true;
  } catch (e) {
    console.error('Save failed', e);
    return false;
  }
}

function showToast(msg) {
  const existing = document.querySelector('.toast');
  if (existing) existing.remove();
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  requestAnimationFrame(() => t.classList.add('show'));
  setTimeout(() => {
    t.classList.remove('show');
    setTimeout(() => t.remove(), 300);
  }, 1800);
}

async function logEvent() {
  const entry = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), timestamp: new Date().toISOString(), comment: '' };
  events.unshift(entry);
  const ok = await saveEvents();
  showToast(ok ? 'Logged' : 'Logged (save failed — check connection)');
  render();
}

async function deleteEvent(id) {
  events = events.filter(e => e.id !== id);
  await saveEvents();
  render();
}

async function updateComment(id, value) {
  const entry = events.find(e => e.id === id);
  if (entry) entry.comment = value;
  await saveEvents();
}

function exportCSV() {
  const rows = [['Date', 'Time', 'Comment']];
  const sorted = [...events].sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));
  sorted.forEach(e => {
    const d = new Date(e.timestamp);
    const dateStr = d.toLocaleDateString('en-GB');
    const timeStr = fmtTime(d);
    const comment = (e.comment || '').replace(/"/g, '""');
    rows.push([dateStr, timeStr, `"${comment}"`]);
  });
  const csv = rows.map(r => r.join(',')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `seizure-log-${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('CSV downloaded');
}

function renderHome() {
  app.innerHTML = `
    <h1>Seizure Log</h1>
    <div class="home-buttons">
      <button class="big-btn log-btn" id="logBtn"><span class="icon">＋</span> Log Seizure</button>
      <button class="big-btn history-btn" id="historyBtn"><span class="icon">☰</span> History (${events.length})</button>
      <button class="big-btn history-btn" id="statsBtn"><span class="icon">📊</span> Stats</button>
    </div>
    <div class="footer-note">Data is stored privately on this device</div>
  `;
  document.getElementById('logBtn').onclick = logEvent;
  document.getElementById('historyBtn').onclick = () => { view = 'history'; render(); };
  document.getElementById('statsBtn').onclick = () => { view = 'stats'; render(); };
}

function dayStart(d) {
  return new Date(d.getFullYear(), d.getMonth(), d.getDate());
}
function fmtDay(d) {
  return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
}
function fmtWeekOf(d) {
  return 'w/o ' + d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
}
function svgEl(tag, attrs) {
  return '<' + tag + ' ' + Object.entries(attrs).map(([k, v]) => `${k}="${v}"`).join(' ') + '/>';
}

function renderStats() {
  const topbar = `
    <div class="topbar">
      <button class="back-btn" id="backBtn">‹ Back</button>
      <div></div>
    </div>
  `;

  if (events.length === 0) {
    app.innerHTML = topbar + `<div class="empty-state">No entries yet.<br>Log a seizure first to see stats here.</div>`;
    document.getElementById('backBtn').onclick = () => { view = 'home'; render(); };
    return;
  }

  const dated = events.map(e => ({ d: new Date(e.timestamp) })).sort((a, b) => a.d - b.d);

  // ---- stat tiles ----
  const total = dated.length;
  const firstDay = dayStart(dated[0].d);
  const lastDay = dayStart(dated[dated.length - 1].d);
  const spanDays = Math.round((lastDay - firstDay) / 86400000) + 1;
  const avg = (total / spanDays).toFixed(1);
  const distinctDays = new Set(dated.map(x => dayStart(x.d).getTime())).size;

  let html = `<div class="stats-row">
    <div class="stat-tile"><div class="v">${total}</div><div class="l">Total logged</div></div>
    <div class="stat-tile"><div class="v">${distinctDays}</div><div class="l">Days with an entry</div></div>
    <div class="stat-tile"><div class="v">${avg}</div><div class="l">Avg per day</div></div>
  </div>`;

  // ---- frequency chart: daily if <=20 distinct days tracked, else weekly ----
  const useWeekly = spanDays > 20;
  const buckets = new Map();
  dated.forEach(x => {
    let keyDate;
    if (useWeekly) {
      const d = dayStart(x.d);
      const dow = (d.getDay() + 6) % 7; // Monday = 0
      keyDate = new Date(d.getFullYear(), d.getMonth(), d.getDate() - dow);
    } else {
      keyDate = dayStart(x.d);
    }
    const key = keyDate.getTime();
    buckets.set(key, (buckets.get(key) || 0) + 1);
  });
  const bucketList = [...buckets.entries()].sort((a, b) => a[0] - b[0]).map(([t, c]) => ({ date: new Date(t), count: c }));
  const shown = bucketList.slice(-14); // most recent 14 buckets

  const chartW = 400, chartH = 170, padL = 22, padR = 6, padT = 14, padB = 24;
  const plotW = chartW - padL - padR, plotH = chartH - padT - padB;
  const maxCount = Math.max(1, ...shown.map(b => b.count));
  const niceMax = Math.max(2, Math.ceil(maxCount / 2) * 2);
  const step = plotW / shown.length;
  const bw = Math.min(30, step * 0.55);

  let svg = `<svg viewBox="0 0 ${chartW} ${chartH}" role="img" aria-label="Incidents ${useWeekly ? 'per week' : 'per day'}">`;
  const ticks = 4;
  for (let i = 0; i <= ticks; i++) {
    const val = Math.round((niceMax / ticks) * i);
    const y = padT + plotH - (val / niceMax) * plotH;
    svg += svgEl('line', { class: 'grid-line', x1: padL, x2: chartW - padR, y1: y, y2: y });
    svg += `<text class="axis-label" x="${padL - 5}" y="${y + 3}" text-anchor="end">${val}</text>`;
  }
  shown.forEach((b, i) => {
    const x = padL + step * i + (step - bw) / 2;
    const h = (b.count / niceMax) * plotH;
    const y = padT + plotH - h;
    svg += svgEl('rect', { class: 'bar-fill', x, y, width: bw, height: Math.max(h, 2), rx: 4, ry: 4 });
    svg += `<text class="bar-label" x="${x + bw / 2}" y="${y - 5}">${b.count}</text>`;
    const label = useWeekly ? fmtDay(b.date) : fmtDay(b.date);
    svg += `<text class="axis-label" x="${x + bw / 2}" y="${chartH - 6}" text-anchor="middle">${label}</text>`;
  });
  svg += svgEl('line', { class: 'baseline', x1: padL, x2: chartW - padR, y1: padT + plotH, y2: padT + plotH });
  svg += `</svg>`;

  html += `<div class="chart-card">
    <h2>Incidents ${useWeekly ? 'per week' : 'per day'}</h2>
    <p class="cap">${useWeekly ? 'Most recent 14 weeks' : 'Most recent 14 days with an entry'}</p>
    ${svg}
  </div>`;

  // ---- time of day: one dot per episode, one column per day, scrolls left-right ----
  const dayGroups = new Map();
  dated.forEach(x => {
    const key = dayStart(x.d).getTime();
    if (!dayGroups.has(key)) dayGroups.set(key, []);
    dayGroups.get(key).push(x.d);
  });
  const todDays = [...dayGroups.entries()].sort((a, b) => a[0] - b[0]).map(([t, list]) => ({ date: new Date(t), list }));

  const todH = 200, todPadT = 10, todPadB = 26;
  const todPlotH = todH - todPadT - todPadB;
  const dayW = 52;
  const todW = Math.max(todDays.length * dayW, dayW);
  const hourTicks = [0, 6, 12, 18, 24];
  const tickY = h => todPadT + todPlotH - (h / 24) * todPlotH;

  let axisHtml = hourTicks.map(h => {
    const label = h === 24 ? '24:00' : String(h).padStart(2, '0') + ':00';
    return `<div style="position:absolute; top:${tickY(h) - 6}px; right:4px; font-size:10.5px; color:var(--text-dim); white-space:nowrap;">${label}</div>`;
  }).join('');

  let todSvg = `<svg width="${todW}" height="${todH}" role="img" aria-label="Time of day per episode" style="display:block; width:${todW}px; max-width:none;">`;
  hourTicks.forEach(h => {
    const y = tickY(h);
    todSvg += svgEl('line', { class: 'grid-line', x1: 0, x2: todW, y1: y, y2: y });
  });
  todDays.forEach((day, i) => {
    const cx = i * dayW + dayW / 2;
    if (i > 0) {
      todSvg += svgEl('line', { x1: i * dayW, x2: i * dayW, y1: todPadT, y2: todPadT + todPlotH, stroke: 'var(--border)', 'stroke-width': 1 });
    }
    day.list.forEach(d => {
      const frac = (d.getHours() + d.getMinutes() / 60) / 24;
      const y = todPadT + todPlotH - frac * todPlotH;
      todSvg += svgEl('circle', { cx, cy: y, r: 5, fill: 'var(--accent)', stroke: 'var(--card)', 'stroke-width': 2 });
    });
    todSvg += `<text class="axis-label" x="${cx}" y="${todH - 8}" text-anchor="middle">${fmtDay(day.date)}</text>`;
  });
  todSvg += `</svg>`;

  html += `<div class="chart-card">
    <h2>Time of day</h2>
    <p class="cap">Every episode, by the time it happened — one column per day${todDays.length > 7 ? ', scroll for earlier days' : ''}</p>
    <div style="display:flex;">
      <div style="width:36px; flex-shrink:0; position:relative; height:${todH}px;">${axisHtml}</div>
      <div id="todScroll" style="overflow-x:auto; flex:1;">${todSvg}</div>
    </div>
  </div>`;

  app.innerHTML = topbar + html;
  document.getElementById('backBtn').onclick = () => { view = 'home'; render(); };
  const todScroll = document.getElementById('todScroll');
  if (todScroll) todScroll.scrollLeft = todScroll.scrollWidth;
}

function renderHistory() {
  const sorted = [...events].sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
  app.innerHTML = `
    <div class="topbar">
      <button class="back-btn" id="backBtn">‹ Back</button>
      <button class="export-btn" id="exportBtn">Export CSV</button>
    </div>
    ${sorted.length === 0
      ? `<div class="empty-state">No entries yet.<br>Tap "Log Seizure" on the home screen to record one.</div>`
      : `<div class="entry-list">${sorted.map(e => {
          const d = new Date(e.timestamp);
          return `
          <div class="entry" data-id="${e.id}">
            <div class="entry-header">
              <div>
                <div class="entry-date">${fmtDate(d)}</div>
                <div class="entry-time">${fmtTime(d)}</div>
              </div>
              <div class="entry-actions">
                <button class="icon-btn delete" data-delete="${e.id}">✕</button>
              </div>
            </div>
            <label class="comment-label">Comment</label>
            <textarea class="comment-box" data-comment="${e.id}" placeholder="e.g. duration, trigger, how she felt after...">${e.comment || ''}</textarea>
            <div class="save-hint" data-hint="${e.id}">Saved</div>
          </div>`;
        }).join('')}</div>`
    }
  `;
  document.getElementById('backBtn').onclick = () => { view = 'home'; render(); };
  document.getElementById('exportBtn').onclick = exportCSV;

  document.querySelectorAll('[data-delete]').forEach(btn => {
    btn.onclick = () => {
      if (confirm('Delete this entry? This cannot be undone.')) {
        deleteEvent(btn.getAttribute('data-delete'));
      }
    };
  });

  document.querySelectorAll('[data-comment]').forEach(box => {
    let timeout;
    box.addEventListener('input', () => {
      const id = box.getAttribute('data-comment');
      clearTimeout(timeout);
      timeout = setTimeout(async () => {
        await updateComment(id, box.value);
        const hint = document.querySelector(`[data-hint="${id}"]`);
        if (hint) {
          hint.classList.add('show');
          setTimeout(() => hint.classList.remove('show'), 1200);
        }
      }, 500);
    });
  });
}

function render() {
  if (!loaded) {
    app.innerHTML = `<div class="loading">Loading…</div>`;
    return;
  }
  if (view === 'home') renderHome();
  else if (view === 'stats') renderStats();
  else renderHistory();
}

(async () => {
  render();
  await loadEvents();
  render();
})();
</script>
</body>
</html>
