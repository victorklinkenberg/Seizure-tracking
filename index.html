<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Seizure Log</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #1a1d24;
    --accent: #4f7cff;
    --accent-dark: #3a5fd9;
    --danger: #e5484d;
    --text: #f2f3f5;
    --text-dim: #9aa0ab;
    --border: #2a2e37;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    height: 100%;
    -webkit-tap-highlight-color: transparent;
  }
  #app {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 20px 16px 40px;
  }
  h1 {
    font-size: 20px;
    font-weight: 600;
    text-align: center;
    margin: 8px 0 24px;
    color: var(--text);
  }
  .home-buttons {
    display: flex;
    flex-direction: column;
    gap: 16px;
    margin-top: 20px;
  }
  button {
    font-family: inherit;
    cursor: pointer;
    border: none;
  }
  .big-btn {
    padding: 28px 20px;
    border-radius: 18px;
    font-size: 19px;
    font-weight: 600;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    transition: transform 0.1s ease, opacity 0.15s ease;
  }
  .big-btn:active { transform: scale(0.97); opacity: 0.9; }
  .log-btn { background: linear-gradient(135deg, var(--accent), var(--accent-dark)); }
  .history-btn { background: var(--card); border: 1px solid var(--border); color: var(--text); }
  .icon { font-size: 24px; }

  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: #2ecc71;
    color: #08210f;
    padding: 12px 22px;
    border-radius: 12px;
    font-weight: 600;
    font-size: 15px;
    opacity: 0;
    transition: opacity 0.25s ease, transform 0.25s ease;
    pointer-events: none;
    z-index: 100;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
  }
  .back-btn {
    background: none;
    color: var(--accent);
    font-size: 16px;
    font-weight: 600;
    padding: 8px 0;
  }
  .export-btn {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 14px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
  }

  .empty-state {
    text-align: center;
    color: var(--text-dim);
    margin-top: 60px;
    font-size: 15px;
    line-height: 1.5;
  }

  .entry-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .entry {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 16px;
  }
  .entry-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  .entry-date {
    font-weight: 600;
    font-size: 15px;
  }
  .entry-time {
    color: var(--text-dim);
    font-size: 13px;
    margin-top: 2px;
  }
  .entry-actions {
    display: flex;
    gap: 8px;
  }
  .icon-btn {
    background: none;
    color: var(--text-dim);
    font-size: 18px;
    padding: 4px 6px;
  }
  .icon-btn.delete { color: var(--danger); }
  .comment-box {
    width: 100%;
    background: #12151b;
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    padding: 10px 12px;
    font-size: 14px;
    font-family: inherit;
    resize: vertical;
    min-height: 40px;
    margin-top: 4px;
  }
  .comment-box:focus { outline: 1px solid var(--accent); }
  .comment-label {
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 4px;
    display: block;
  }
  .save-hint {
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 4px;
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  .save-hint.show { opacity: 1; }

  .footer-note {
    text-align: center;
    color: var(--text-dim);
    font-size: 12px;
    margin-top: auto;
    padding-top: 30px;
  }

  .loading {
    text-align: center;
    color: var(--text-dim);
    margin-top: 60px;
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
const STORAGE_KEY = 'seizure-events';
let events = [];
let view = 'home'; // 'home' | 'history'
let loaded = false;

const app = document.getElementById('app');

function fmtDate(d) {
  return d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
}
function fmtTime(d) {
  return d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
}

async function loadEvents() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    events = raw ? JSON.parse(raw) : [];
  } catch (e) {
    events = [];
  }
  loaded = true;
}

async function saveEvents() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(events));
    return true;
  } catch (e) {
    console.error('Save failed', e);
    return false;
  }
}

function showToast(msg) {
  const existing = document.querySelector('.toast');
  if (existing) existing.remove();
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  requestAnimationFrame(() => t.classList.add('show'));
  setTimeout(() => {
    t.classList.remove('show');
    setTimeout(() => t.remove(), 300);
  }, 1800);
}

async function logEvent() {
  const entry = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), timestamp: new Date().toISOString(), comment: '' };
  events.unshift(entry);
  const ok = await saveEvents();
  showToast(ok ? 'Logged' : 'Logged (save failed — check connection)');
  render();
}

async function deleteEvent(id) {
  events = events.filter(e => e.id !== id);
  await saveEvents();
  render();
}

async function updateComment(id, value) {
  const entry = events.find(e => e.id === id);
  if (entry) entry.comment = value;
  await saveEvents();
}

function exportCSV() {
  const rows = [['Date', 'Time', 'Comment']];
  const sorted = [...events].sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));
  sorted.forEach(e => {
    const d = new Date(e.timestamp);
    const dateStr = d.toLocaleDateString('en-GB');
    const timeStr = fmtTime(d);
    const comment = (e.comment || '').replace(/"/g, '""');
    rows.push([dateStr, timeStr, `"${comment}"`]);
  });
  const csv = rows.map(r => r.join(',')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `seizure-log-${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('CSV downloaded');
}

function renderHome() {
  app.innerHTML = `
    <h1>Seizure Log</h1>
    <div class="home-buttons">
      <button class="big-btn log-btn" id="logBtn"><span class="icon">＋</span> Log Seizure</button>
      <button class="big-btn history-btn" id="historyBtn"><span class="icon">☰</span> History (${events.length})</button>
    </div>
    <div class="footer-note">Data is stored privately on this device</div>
  `;
  document.getElementById('logBtn').onclick = logEvent;
  document.getElementById('historyBtn').onclick = () => { view = 'history'; render(); };
}

function renderHistory() {
  const sorted = [...events].sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
  app.innerHTML = `
    <div class="topbar">
      <button class="back-btn" id="backBtn">‹ Back</button>
      <button class="export-btn" id="exportBtn">Export CSV</button>
    </div>
    ${sorted.length === 0
      ? `<div class="empty-state">No entries yet.<br>Tap "Log Seizure" on the home screen to record one.</div>`
      : `<div class="entry-list">${sorted.map(e => {
          const d = new Date(e.timestamp);
          return `
          <div class="entry" data-id="${e.id}">
            <div class="entry-header">
              <div>
                <div class="entry-date">${fmtDate(d)}</div>
                <div class="entry-time">${fmtTime(d)}</div>
              </div>
              <div class="entry-actions">
                <button class="icon-btn delete" data-delete="${e.id}">✕</button>
              </div>
            </div>
            <label class="comment-label">Comment</label>
            <textarea class="comment-box" data-comment="${e.id}" placeholder="e.g. duration, trigger, how she felt after...">${e.comment || ''}</textarea>
            <div class="save-hint" data-hint="${e.id}">Saved</div>
          </div>`;
        }).join('')}</div>`
    }
  `;
  document.getElementById('backBtn').onclick = () => { view = 'home'; render(); };
  document.getElementById('exportBtn').onclick = exportCSV;

  document.querySelectorAll('[data-delete]').forEach(btn => {
    btn.onclick = () => {
      if (confirm('Delete this entry? This cannot be undone.')) {
        deleteEvent(btn.getAttribute('data-delete'));
      }
    };
  });

  document.querySelectorAll('[data-comment]').forEach(box => {
    let timeout;
    box.addEventListener('input', () => {
      const id = box.getAttribute('data-comment');
      clearTimeout(timeout);
      timeout = setTimeout(async () => {
        await updateComment(id, box.value);
        const hint = document.querySelector(`[data-hint="${id}"]`);
        if (hint) {
          hint.classList.add('show');
          setTimeout(() => hint.classList.remove('show'), 1200);
        }
      }, 500);
    });
  });
}

function render() {
  if (!loaded) {
    app.innerHTML = `<div class="loading">Loading…</div>`;
    return;
  }
  if (view === 'home') renderHome();
  else renderHistory();
}

(async () => {
  render();
  await loadEvents();
  render();
})();
</script>
</body>
</html>
